[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ssi-extractor"
version = "0.1.0"
description = "Hybrid agentic pipeline that extracts banking Standard Settlement Instructions from PDFs into a runtime-discovered JSON schema with per-field validation, confidence and page citations."
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.4",
    "langgraph>=0.2",
    "langgraph-checkpoint-sqlite>=2.0",
    "openai>=1.40",
    "anthropic>=0.34",
    "pymupdf>=1.24",
    "pdfplumber>=0.11",
    "pillow>=10.3",
    "numpy>=2.0",
    "opencv-python-headless>=4.10",
    "scikit-image>=0.24",
    "rapidocr>=3.0",
    "onnxruntime>=1.19",
    "presidio-analyzer>=2.2.35",
    "presidio-anonymizer>=2.2.35",
    "schwifty>=2024.5",
    "pycountry>=24.6",
    "jsonschema>=4.23",
    "pyyaml>=6.0",
    "cryptography>=43.0",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
ssi-extract = "ssi_extractor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-m 'not llm'"
markers = [
    "llm: exercises a real LLM provider call (requires credentials and network)",
]
